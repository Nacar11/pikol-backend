name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pikol
          POSTGRES_PASSWORD: pikol
          POSTGRES_DB: pikol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pikol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pikol:pikol@localhost:5432/pikol
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest -v
